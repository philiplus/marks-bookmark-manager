name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Create source and build archives
        env:
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          tar -czf "marks-${REF_NAME}-dist.tar.gz" dist/client
          tar -czf "marks-${REF_NAME}-source.tar.gz" \
            --exclude=node_modules --exclude=.git --exclude=data --exclude=dist \
            .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$REF_NAME" \
            "marks-${REF_NAME}-dist.tar.gz" \
            "marks-${REF_NAME}-source.tar.gz" \
            --title "Marks $REF_NAME" \
            --generate-notes \
            --verify-tag
